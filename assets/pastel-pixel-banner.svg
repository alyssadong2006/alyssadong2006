<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
  <title id="title">Alyssa — AMATH and machine learning student, creative coder</title>
  <desc id="description">A detailed pastel pixel-art desk scene with a smiling computer, a sunflower in a vase, flowers, and Alyssa's short introduction.</desc>
  <style>
    @keyframes computer-blink {
      0%, 92%, 100% { opacity: 1; }
      94%, 98% { opacity: 0.15; }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .computer-eye {
      animation: computer-blink 4.6s steps(1, end) infinite;
    }
    .flower {
      animation: sparkle 2.4s ease-in-out infinite;
    }
    .plant-leaf { animation: sparkle 3.2s ease-in-out infinite; }
    .sunflower-petal { animation: sparkle 2.8s ease-in-out infinite; }
    .sunflower-petal-two { animation-delay: -1.4s; }
    .flower-two { animation-delay: -0.8s; }
    .flower-three { animation-delay: -1.6s; }
    .flower-four { animation-delay: -2.2s; }
    .flower-five { animation-delay: -0.5s; }
    .flower-six { animation-delay: -1.4s; }
    .sparkle { animation: sparkle 2.4s ease-in-out infinite; }
    .sparkle-two { animation-delay: -1.2s; }
    .leaf-two { animation-delay: -0.5s; }
    .leaf-three { animation-delay: -1s; }
    @media (prefers-reduced-motion: reduce) {
      .computer-eye, .flower, .sparkle, .plant-leaf, .sunflower-petal { animation: none; }
    }
  </style>

