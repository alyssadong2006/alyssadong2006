<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
  <title id="title">Alyssa — AMATH and machine learning student, creative coder</title>
  <desc id="description">A detailed pastel pixel-art desk scene with a smiling computer, flowers, books, and Alyssa's short introduction.</desc>
  <style>
    @keyframes plant-sway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes computer-blink {
      0%, 93%, 100% { transform: scaleY(1); }
      95%, 98% { transform: scaleY(0.12); }
    }
    @keyframes flower-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .plant {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: plant-sway 3.8s ease-in-out infinite;
    }
    .computer-eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: computer-blink 4.6s steps(1, end) infinite;
    }
    .flower {
      transform-box: fill-box;
      transform-origin: center;
      animation: flower-bob 3s ease-in-out infinite;
    }
    .flower-two { animation-delay: -0.8s; }
    .flower-three { animation-delay: -1.6s; }
    .flower-four { animation-delay: -2.2s; }
    .flower-five { animation-delay: -0.5s; }
    .flower-six { animation-delay: -1.4s; }
    .sparkle { animation: sparkle 2.4s ease-in-out infinite; }
    .sparkle-two { animation-delay: -1.2s; }
    @media (prefers-reduced-motion: reduce) {
      .plant, .computer-eye, .flower, .sparkle { animation: none; }
    }
  </style>

  <rect width="1000" height="300" fill="#fff3f8"/>
  <rect x="8" y="8" width="984" height="284" fill="#d9c2ed"/>
  <rect x="16" y="16" width="968" height="268" fill="#fff8fc"/>
  <rect x="24" y="24" width="952" height="252" fill="#f8eaff"/>
  <rect x="32" y="32" width="936" height="236" fill="#fff3f8"/>

  <g fill="#e9d8f6">
    <rect x="40" y="40" width="192" height="216"/>
    <rect x="768" y="40" width="192" height="216"/>
  </g>
  <g fill="#f5eafa">
    <rect x="48" y="48" width="176" height="200"/>
    <rect x="776" y="48" width="176" height="200"/>
  </g>

  <!-- Pixel stars and floating hearts -->
  <g class="flower flower-one" fill="#e99cbd">
    <rect x="72" y="64" width="8" height="8"/><rect x="64" y="72" width="8" height="8"/><rect x="72" y="80" width="8" height="8"/><rect x="80" y="72" width="8" height="8"/><rect x="72" y="72" width="8" height="8" fill="#f2cc78"/>
  </g>
  <g class="flower flower-two" fill="#e99cbd">
    <rect x="184" y="96" width="8" height="8"/><rect x="176" y="104" width="8" height="8"/><rect x="184" y="112" width="8" height="8"/><rect x="192" y="104" width="8" height="8"/><rect x="184" y="104" width="8" height="8" fill="#f2cc78"/>
  </g>
  <g class="flower flower-three" fill="#e99cbd">
    <rect x="808" y="72" width="8" height="8"/><rect x="800" y="80" width="8" height="8"/><rect x="808" y="88" width="8" height="8"/><rect x="816" y="80" width="8" height="8"/><rect x="808" y="80" width="8" height="8" fill="#f2cc78"/>
  </g>
  <g class="flower flower-four" fill="#e99cbd">
    <rect x="896" y="152" width="8" height="8"/><rect x="888" y="160" width="8" height="8"/><rect x="896" y="168" width="8" height="8"/><rect x="904" y="160" width="8" height="8"/><rect x="896" y="160" width="8" height="8" fill="#f2cc78"/>
  </g>
  <g class="flower flower-five" fill="#f2cc78">
    <rect x="112" y="112" width="8" height="8"/><rect x="104" y="120" width="8" height="8"/><rect x="112" y="128" width="8" height="8"/><rect x="120" y="120" width="8" height="8"/><rect x="112" y="120" width="8" height="8" fill="#fff3f8"/>
  </g>
  <g class="flower flower-six" fill="#f2cc78">
    <rect x="856" y="104" width="8" height="8"/><rect x="848" y="112" width="8" height="8"/><rect x="856" y="120" width="8" height="8"/><rect x="864" y="112" width="8" height="8"/><rect x="856" y="112" width="8" height="8" fill="#fff3f8"/>
  </g>
  <g class="sparkle" fill="#b9a2df">
    <rect x="144" y="64" width="8" height="8"/><rect x="144" y="80" width="8" height="8"/><rect x="136" y="72" width="8" height="8"/><rect x="152" y="72" width="8" height="8"/>
  </g>
  <g class="sparkle sparkle-two" fill="#b9a2df">
    <rect x="840" y="192" width="8" height="8"/><rect x="840" y="208" width="8" height="8"/><rect x="832" y="200" width="8" height="8"/><rect x="848" y="200" width="8" height="8"/>
  </g>

  <!-- Friendly pixel computer -->
  <g>
    <rect x="88" y="144" width="112" height="72" fill="#8873a8"/>
    <rect x="96" y="152" width="96" height="56" fill="#c6b3e4"/>
    <rect x="104" y="160" width="80" height="40" fill="#fff8fc"/>
    <rect class="computer-eye" x="120" y="176" width="8" height="12" fill="#65517f"/>
    <rect class="computer-eye" x="160" y="176" width="8" height="12" fill="#65517f" style="animation-delay: -0.18s"/>
    <rect x="136" y="192" width="16" height="4" fill="#e88eae"/>
    <rect x="136" y="216" width="16" height="8" fill="#8873a8"/>
    <rect x="112" y="224" width="64" height="8" fill="#8873a8"/>
    <rect x="80" y="232" width="128" height="8" fill="#b9a2df"/>
    <rect x="88" y="240" width="112" height="8" fill="#8873a8"/>
    <rect x="104" y="232" width="8" height="4" fill="#f2cc78"/>
    <rect x="120" y="232" width="8" height="4" fill="#f2cc78"/>
    <rect x="136" y="232" width="8" height="4" fill="#f2cc78"/>
  </g>

  <!-- Little potted pixel plant -->
  <g class="plant">
    <rect x="808" y="176" width="8" height="32" fill="#73a88a"/>
    <rect x="784" y="160" width="24" height="8" fill="#73a88a"/>
    <rect x="800" y="152" width="16" height="8" fill="#73a88a"/>
    <rect x="816" y="168" width="24" height="8" fill="#73a88a"/>
    <rect x="824" y="160" width="8" height="8" fill="#73a88a"/>
    <rect x="792" y="208" width="40" height="8" fill="#d78da8"/>
    <rect x="800" y="216" width="24" height="24" fill="#e8a9ba"/>
    <rect x="792" y="240" width="40" height="8" fill="#bd7d99"/>
    <rect x="808" y="224" width="8" height="8" fill="#fff3f8"/>
  </g>

  <!-- Introduction panel -->
  <g text-anchor="middle" font-family="monospace" font-weight="700">
    <rect x="264" y="56" width="472" height="192" fill="#edddf5"/>
    <rect x="272" y="48" width="456" height="192" fill="#fffafd"/>
    <rect x="280" y="56" width="440" height="8" fill="#e7c4da"/>
    <rect x="280" y="224" width="440" height="8" fill="#e7c4da"/>
    <rect x="280" y="64" width="8" height="160" fill="#e7c4da"/>
    <rect x="712" y="64" width="8" height="160" fill="#e7c4da"/>
    <text x="500" y="96" font-size="26" fill="#745984">HI THERE! I'M ALYSSA ♡</text>
    <rect x="336" y="108" width="328" height="2" fill="#ead7ed"/>
    <text x="500" y="138" font-size="18" fill="#9c6c9b">AMATH + ML STUDENT</text>
    <text x="500" y="169" font-size="18" fill="#c16f98">CREATIVE CODER</text>
    <text x="500" y="200" font-size="16" fill="#7f8f78">ALWAYS LEARNING NEW THINGS</text>
  </g>

  <g fill="#f2cc78">
    <rect x="304" y="80" width="8" height="8"/><rect x="688" y="80" width="8" height="8"/>
    <rect x="304" y="200" width="8" height="8"/><rect x="688" y="200" width="8" height="8"/>
  </g>
</svg>
